name: Deploy 望崽宠乐园 to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hosted/standalone index.html is ~30 MB because it embeds the 17 MB
      # generic EXE engine for offline use. github.io is slow with that, so
      # Pages serves the multi-file source: a small HTML shell, parallel assets,
      # and the same engine at download/wangzai-pet.exe fetched only on export.
      - name: Build lightweight Pages entry
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp web/index-src.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
